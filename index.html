<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <title>Mijn Website</title>

    <style>
        h1 {
            color: red;
        }

        button {
            background: blue;
            color: white;
        }

        .teamkaart h4 {
            font-size: 24px;
        }

        .teamkaart {
            border: 2px solid black;
            padding: 10px;
            width: 250px;
            margin: 10px;
            background-color: lightblue;
        }

        #klok {
            font-size: 30px;
            font-weight: bold;
            color: blue;
        }
    </style>
</head>

<body>

    <h1>Mijn Website</h1>

    <p>Welkom op mijn website</p>

    <button>klik hier</button>

    <button onclick="hallo()">klik mij</button>

    <h2>Mijn fortnite team</h2>

    <p>wij zoeken nieuwe spelers!</p>

    <h5>DE GOAT</h5>

    <div id="klok">00:00:00</div>

    <h3>Teamleden</h3>

    <p>Thijs - Teamleider</p>

    <img src="https://fortnite-api.com/images/cosmetics/br/character_default/icon.png">

    <div class="teamkaart">
        <h4>Thijs</h4>
        <p>Teamleider van het team</p>
    </div>

    <div class="teamkaart">
        <h4>Mijn vriend</h4>
        <p>Teamlid</p>
    </div>

    <script>

        function hallo() {
            alert("hoi!");
        }

        function updateKlok() {
            let tijd = new Date();

            let uren = tijd.getHours();
            let minuten = tijd.getMinutes();
            let seconden = tijd.getSeconds();

            if (minuten < 10) {
                minuten = "0" + minuten;
            }

            if (seconden < 10) {
                seconden = "0" + seconden;
            }

            document.getElementById("klok").innerText =
                uren + ":" + minuten + ":" + seconden;
        }

        setInterval(updateKlok, 1000);

        updateKlok();

    </script>

</body>

</html>
